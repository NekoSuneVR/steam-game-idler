services:
  steam-game-idler:
    image: ghcr.io/nekosunevr/steam-game-idler-headless:dev
    pull_policy: always
    container_name: steam-game-idler-headless
    restart: unless-stopped
    init: true
    environment:
      PORT: "8080"
      WEB_USER: "${WEB_USER:-admin}"
      WEB_PASSWORD: "${WEB_PASSWORD:?Set WEB_PASSWORD in .env before starting}"
      DATA_DIR: /data
    ports:
      # Bind to loopback by default. Set BIND_ADDRESS to the Pi's LAN IP to allow LAN devices.
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - steam-game-idler-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 20s

volumes:
  steam-game-idler-data:
